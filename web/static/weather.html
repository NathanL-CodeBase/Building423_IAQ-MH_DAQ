<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MH Weather</title>
<script src="/static/plotly.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #0f1115; color: #e6e6e6; }
  header { padding: 12px 20px; background: #161a22; border-bottom: 1px solid #262b36;
           display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #health { font-size: 13px; color: #9aa4b2; }
  #health.ok { color: #40b060; }
  #health.stale { color: #e0a030; }
  main { padding: 16px 20px; max-width: 1100px; }
  .tiles { display:grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap:10px; }
  .tile { background:#161a22; border:1px solid #262b36; border-radius:8px; padding:12px 14px; }
  .tile .label { font-size:11px; color:#9aa4b2; text-transform:uppercase; letter-spacing:.04em; }
  .tile .value { font-size:26px; font-weight:600; margin-top:4px; display:flex; align-items:center; gap:8px; }
  .tile .unit { font-size:13px; color:#9aa4b2; font-weight:400; }
  .tile .sub { font-size:12px; color:#9aa4b2; margin-top:4px; }
  .controls { display:flex; align-items:center; gap:12px; margin:18px 0 8px; }
  select, input[type=date] { background:#0f1115; color:#e6e6e6; border:1px solid #2a3140;
           border-radius:5px; padding:5px 7px; }
  #plot { background:#161a22; border:1px solid #262b36; border-radius:8px; padding:8px; height:820px; }
  .panel { background:#161a22; border:1px solid #262b36; border-radius:8px; padding:14px; margin-top:16px; }
  .panel h2 { font-size:13px; margin:0 0 10px; color:#9aa4b2; text-transform:uppercase; letter-spacing:.04em; }
  label { font-size:13px; color:#c8ccd4; margin-right:12px; }
  .vars { display:flex; flex-wrap:wrap; gap:6px 16px; margin:10px 0; }
  .vars label { display:flex; align-items:center; gap:5px; }
  button { background:#2b6cb0; color:#fff; border:none; border-radius:6px; padding:8px 16px;
           font-size:14px; cursor:pointer; margin-top:6px; }
  button.secondary { background:#2a3140; }
  .row { margin:8px 0; }
  .note { font-size:12px; color:#9aa4b2; margin:6px 0; }
</style>
</head>
<body>
<header>
  <h1>Manufactured House Weather (AIO 2)</h1>
  <span id="health">connecting...</span>
</header>
<main>
  <div class="tiles" id="tiles"></div>
  <div class="controls">
    <label>Window
      <select id="hours">
        <option value="24" selected>24 hours</option>
        <option value="72">3 days</option>
        <option value="168">7 days</option>
      </select>
    </label>
  </div>
  <div id="plot"></div>
  <div class="note">Wind direction is the direction the wind blows from, referenced to magnetic north, averaged as a speed-weighted vector. Gust is the highest 1 s wind speed in each plotted interval.</div>
  <div class="panel">
    <h2>Download data</h2>
    <div class="row">
      <label>Start <input type="date" id="start"></label>
      <label>End <input type="date" id="end"></label>
    </div>
    <div class="note" id="dl-note"></div>
    <div class="row">
      <label style="display:block;margin-bottom:6px;">Variables (default all)</label>
      <div class="vars" id="vars"></div>
    </div>
    <div class="row">
      <button onclick="downloadRange()">Download CSV</button>
      <button class="secondary" onclick="downloadToday()">Today only</button>
    </div>
  </div>
</main>
<script src="/static/weather.js"></script>
</body>
</html>
